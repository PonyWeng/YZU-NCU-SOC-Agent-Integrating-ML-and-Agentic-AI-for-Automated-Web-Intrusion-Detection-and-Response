input {
  http {
    port => 5044
    codec => json  # parse JSON body directly; each element in array becomes one event
  }
}

filter {
  # When the codec is json_lines/json, an array body produces one event per element.
  # Each event is already a flat hash — no json/split needed.
  mutate {
    # Remove auto-added HTTP metadata we don't want in ES
    remove_field => ["headers", "user_agent", "http_version", "http_user_agent",
                     "http_accept", "request_path", "request_method"]
    # src_ip is already the real attacker IP — copy to host.ip for ECS compatibility
    copy => { "src_ip" => "[host][ip]" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "prediction-logs-%{+YYYY.MM.dd}"
    document_id => "%{id}"
    action => "index"
    template_overwrite => true
    user => "elastic"
    password => "vEo4PSW2yMiHIMMTxAHk"
  }
  stdout { codec => rubydebug }
}
